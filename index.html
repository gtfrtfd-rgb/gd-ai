<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b18">
<title>Geometry Dash</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#0b0b18;
    touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
  }
  canvas { display:block; position:fixed; inset:0; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function(){
'use strict';

/* ============ КОНСТАНТЫ ============ */
const U        = 40;              // размер клетки / игрока
const GRAVITY  = 2400;
const JUMP_V   = -800;
const SPEED    = 340;
const STEP     = 1/120;
const ROT_SPEED = Math.PI / 0.667; // 180° за прыжок

/* ============ СОСТОЯНИЕ ============ */
const cv  = document.getElementById('game');
const ctx = cv.getContext('2d');

let W=0,H=0,DPR=1,scale=1,worldW=0,worldH=0,groundY=0,playerScreenX=0;

let state      = 'ready';     // ready | playing | dead
let holding    = false;
let cameraX    = 0;
let shake      = 0;
let flashAlpha = 0;
let attempts   = 0;
let best       = +(localStorage.getItem('gd_best') || 0);
let deathTimer = 0;
let acc        = 0;
let lastTime   = 0;

const player = { x:0, y:0, vy:0, size:U, rot:0, onGround:true };
let obstacles  = [];
let particles  = [];
let nextSpawnX = 0;

/* ============ УТИЛИТЫ ============ */
function roundRect(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
const spike = (x,y) => ({ type:'spike', x, y, w:U, h:U });
const block = (x,y,w,h) => ({ type:'block', x, y, w, h });

/* ============ РАЗМЕРЫ / RESIZE ============ */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  cv.width  = Math.round(W*DPR);
  cv.height = Math.round(H*DPR);
  cv.style.width  = W+'px';
  cv.style.height = H+'px';

  const oldGround = groundY;

  scale     = Math.min(H/420, W/450);
  worldW    = W/scale;
  worldH    = H/scale;
  groundY   = worldH - Math.max(90, Math.min(worldH*0.22, 200));
  playerScreenX = Math.min(worldW*0.30, 240);

  if (oldGround && state !== 'ready'){
    const d = groundY - oldGround;
    player.y += d;
    for (const o of obstacles) o.y += d;
  }
}

/* ============ СБРОС ============ */
function reset(){
  player.x  = 0;
  player.y  = groundY - U;
  player.vy = 0;
  player.rot = 0;
  player.onGround = true;

  obstacles.length = 0;
  particles.length = 0;
  nextSpawnX = 800;
  cameraX    = player.x - playerScreenX;
  shake      = 0;
  flashAlpha = 0;
  acc        = 0;
  deathTimer = 0;
}

/* ============ ГЕНЕРАЦИЯ УРОВНЯ ============ */
function generateAhead(){
  while (nextSpawnX < cameraX + worldW + 700){
    spawnPattern();
  }
  if (obstacles.length > 80){
    obstacles = obstacles.filter(o => o.x + o.w > cameraX - 400);
  }
}

function spawnPattern(){
  const x = nextSpawnX;

  let pool = ['spike1','spike1','spike1','spike2','spike2','spike3',
              'block1','block1','blockSpike','block2'];
  if (player.x < 1500) pool = ['spike1','spike1','spike2','block1'];

  const kind = pool[(Math.random()*pool.length)|0];
  let width = 0;

  switch(kind){
    case 'spike1':
      obstacles.push(spike(x, groundY - U));
      width = U; break;

    case 'spike2':
      obstacles.push(spike(x, groundY - U));
      obstacles.push(spike(x+U, groundY - U));
      width = U*2; break;

    case 'spike3':
      obstacles.push(spike(x, groundY - U));
      obstacles.push(spike(x+U, groundY - U));
      obstacles.push(spike(x+2*U, groundY - U));
      width = U*3; break;

    case 'block1':
      obstacles.push(block(x, groundY - U, U, U));
      width = U; break;

    case 'block2':
      obstacles.push(block(x, groundY - U, U, U));
      obstacles.push(block(x+U, groundY - U, U, U));
      width = U*2; break;

    case 'blockSpike':
      obstacles.push(block(x, groundY - U, U, U));
      obstacles.push(spike(x, groundY - 2*U));
      width = U; break;
  }

  const diff = Math.min(1, player.x / 12000);
  const gap  = Math.max(200, 340 - 120*diff + Math.random()*140);
  nextSpawnX = x + width + gap;
}

/* ============ ЧАСТИЦЫ ============ */
function explode(cx, cy){
  for (let i=0;i<46;i++){
    const a = Math.random()*Math.PI*2;
    const s = 120 + Math.random()*520;
    particles.push({
      x:cx, y:cy,
      vx: Math.cos(a)*s,
      vy: Math.sin(a)*s - 120,
      g: 1400,
      life: 0.6 + Math.random()*0.5,
      maxLife: 1,
      size: 4 + Math.random()*9,
      rot: Math.random()*6.28,
      vr: (Math.random()-0.5)*14,
      color: Math.random() < 0.6 ? '#ffd93d' : '#ff6b9d'
    });
  }
  for (const p of particles) p.maxLife = p.life;
}

function updateParticles(dt){
  for (let i = particles.length-1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles.splice(i,1); continue; }
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    p.vy += p.g*dt;
    p.rot += p.vr*dt;
  }
}

/* ============ СМЕРТЬ ============ */
function die(){
  if (state !== 'playing') return;
  state = 'dead';
  deathTimer = 0;
  shake = 10;
  flashAlpha = 0.55;
  explode(player.x + U/2, player.y + U/2);

  const dist = Math.floor(player.x / U);
  if (dist > best){
    best = dist;
    try { localStorage.setItem('gd_best', best); } catch(e){}
  }
}

/* ============ ФИЗИКА ============ */
function update(dt){
  const p = player;
  const prevBottom = p.y + p.size;

  p.vy += GRAVITY*dt;
  if (p.vy > 2200) p.vy = 2200;

  p.x += SPEED*dt;
  p.y += p.vy*dt;

  p.onGround = false;

  /* земля */
  if (p.y + p.size >= groundY){
    p.y = groundY - p.size;
    p.vy = 0;
    p.onGround = true;
  }

  /* блоки */
  for (let i=0;i<obstacles.length;i++){
    const o = obstacles[i];
    if (o.type === 'spike') continue;

    if (p.x + p.size > o.x && p.x < o.x + o.w &&
        p.y + p.size > o.y && p.y < o.y + o.h){

      const pen = (p.y + p.size) - o.y;
      const tolerance = Math.max(12, p.vy*dt + 4);

      if (p.vy >= 0 && pen <= tolerance && prevBottom <= o.y + 12){
        p.y = o.y - p.size;
        p.vy = 0;
        p.onGround = true;
      } else {
        die(); return;
      }
    }
  }

  /* шипы */
  for (let i=0;i<obstacles.length;i++){
    const o = obstacles[i];
    if (o.type !== 'spike') continue;

    const hx = o.x + o.w*0.30;
    const hy = o.y + o.h*0.35;
    const hw = o.w*0.40;
    const hh = o.h*0.65;

    if (p.x + p.size > hx && p.x < hx + hw &&
        p.y + p.size > hy && p.y < hy + hh){
      die(); return;
    }
  }

  /* прыжок */
  if (p.onGround && holding){
    p.vy = JUMP_V;
    p.onGround = false;
    for (let i=0;i<7;i++){
      particles.push({
        x: p.x + Math.random()*U, y: p.y + p.size,
        vx: -SPEED*0.35 + (Math.random()-0.5)*90,
        vy: -Math.random()*90,
        g: 260,
        life: 0.35 + Math.random()*0.2,
        maxLife: 1,
        size: 3 + Math.random()*4,
        rot: Math.random()*6.28, vr:(Math.random()-0.5)*10,
        color: '#9d7cff'
      });
    }
    for (let i=particles.length-7;i<particles.length;i++){
      if (particles[i]) particles[i].maxLife = particles[i].life;
    }
  }

  /* вращение */
  if (p.onGround){
    const snap = Math.PI/2;
    p.rot = Math.round(p.rot/snap)*snap;
  } else {
    p.rot += ROT_SPEED*dt;
  }

  /* камера */
  cameraX = p.x - playerScreenX;

  generateAhead();

  /* пыль из-под куба */
  if (p.onGround && Math.random() < 0.35){
    particles.push({
      x: p.x + Math.random()*8, y: p.y + p.size,
      vx: -SPEED*0.3 + (Math.random()-0.5)*50,
      vy: -Math.random()*70,
      g: 240,
      life: 0.3 + Math.random()*0.2,
      maxLife: 1,
      size: 2 + Math.random()*3,
      rot: Math.random()*6.28, vr:(Math.random()-0.5)*8,
      color: '#7c5cff'
    });
    particles[particles.length-1].maxLife = particles[particles.length-1].life;
  }

  if (particles.length > 400) particles.splice(0, particles.length-400);
}

/* ============ ОТРИСОВКА: ФОН ============ */
function drawBackground(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,   '#1b1040');
  g.addColorStop(0.45,'#2b1b60');
  g.addColorStop(1,   '#0d0a22');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // параллакс-сетка
  const step = 130*scale;
  const offX = -(((cameraX*0.25*scale) % step) + step) % step;

  ctx.save();
  ctx.strokeStyle = 'rgba(150,120,255,0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = offX; x < W + step; x += step){
    ctx.moveTo(x, 0); ctx.lineTo(x, H);
  }
  for (let y = 0; y < H + step; y += step){
    ctx.moveTo(0, y); ctx.lineTo(W, y);
  }
  ctx.stroke();
  ctx.restore();

  // «горизонт» свечение
  const gy = groundY*scale;
  const rg = ctx.createLinearGradient(0, gy-160, 0, gy);
  rg.addColorStop(0, 'rgba(124,92,255,0)');
  rg.addColorStop(1, 'rgba(124,92,255,0.18)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, gy-160, W, 160);
}

/* ============ ОТРИСОВКА: ЗЕМЛЯ ============ */
function drawGround(){
  const top = groundY;
  const bottom = worldH;

  ctx.fillStyle = '#0d0b22';
  ctx.fillRect(cameraX - 40, top, worldW + 80, bottom - top + 60);

  // вертикальные линии
  const startX = Math.floor((cameraX - 40)/U)*U;
  ctx.fillStyle = 'rgba(124,92,255,0.14)';
  for (let x = startX; x < cameraX + worldW + 60; x += U){
    ctx.fillRect(x, top, 2, bottom - top + 60);
  }
  // горизонтальные линии
  ctx.fillStyle = 'rgba(124,92,255,0.09)';
  for (let y = top + U; y < bottom + 60; y += U){
    ctx.fillRect(cameraX - 40, y, worldW + 80, 2);
  }

  // свечение + верхняя кромка
  ctx.fillStyle = 'rgba(124,92,255,0.30)';
  ctx.fillRect(cameraX - 40, top - 10, worldW + 80, 7);
  ctx.fillStyle = '#7c5cff';
  ctx.fillRect(cameraX - 40, top - 3, worldW + 80, 3);
}

/* ============ ОТРИСОВКА: ПРЕПЯТСТВИЯ ============ */
function drawObstacles(){
  for (let i=0;i<obstacles.length;i++){
    const o = obstacles[i];
    if (o.x + o.w < cameraX - 120) continue;
    if (o.x > cameraX + worldW + 120) continue;

    if (o.type === 'spike'){
      ctx.beginPath();
      ctx.moveTo(o.x + 1.5, o.y + o.h);
      ctx.lineTo(o.x + o.w/2, o.y + 1.5);
      ctx.lineTo(o.x + o.w - 1.5, o.y + o.h);
      ctx.closePath();

      ctx.fillStyle = '#ff3d6e';
      ctx.fill();
      ctx.strokeStyle = '#ffa8c4';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(o.x + o.w/2, o.y + 9);
      ctx.lineTo(o.x + o.w/2 - 6, o.y + o.h - 5);
      ctx.lineTo(o.x + o.w/2 + 6, o.y + o.h - 5);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fill();

    } else {
      roundRect(o.x, o.y, o.w, o.h, 5);
      ctx.fillStyle = '#2a2350';
      ctx.fill();
      ctx.strokeStyle = '#7c5cff';
      ctx.lineWidth = 3;
      ctx.stroke();

      roundRect(o.x + 8, o.y + 8, o.w - 16, o.h - 16, 3);
      ctx.fillStyle = 'rgba(124,92,255,0.28)';
      ctx.fill();
    }
  }
}

/* ============ ОТРИСОВКА: ИГРОК ============ */
function drawPlayer(){
  const p = player;
  const s = p.size;

  ctx.save();
  ctx.translate(p.x + s/2, p.y + s/2);
  ctx.rotate(p.rot);

  ctx.shadowColor = '#ffd93d';
  ctx.shadowBlur  = 22;

  roundRect(-s/2, -s/2, s, s, 8);
  ctx.fillStyle = '#ffd93d';
  ctx.fill();
  ctx.shadowBlur = 0;

  roundRect(-s/2, -s/2, s, s, 8);
  ctx.strokeStyle = '#1a1230';
  ctx.lineWidth = 4;
  ctx.stroke();

  roundRect(-s/2 + 11, -s/2 + 11, s - 22, s - 22, 4);
  ctx.fillStyle = '#1a1230';
  ctx.fill();

  ctx.restore();
}

/* ============ ОТРИСОВКА: ЧАСТИЦЫ ============ */
function drawParticles(){
  for (let i=0;i<particles.length;i++){
    const p = particles[i];
    const a = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ============ HUD ============ */
function drawHUD(){
  const base = Math.min(W,H);
  const fs = Math.max(12, Math.round(base*0.030));

  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = `bold ${fs}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText('Попытка ' + Math.max(1,attempts), 16, 16);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,217,61,0.9)';
  ctx.fillText('Рекорд: ' + best, W - 16, 16);

  const dist = Math.floor(player.x / U);
  ctx.textAlign = 'center';
  ctx.font = `bold ${Math.round(fs*1.35)}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fillText(dist + ' м', W/2, 14);
}

/* ============ СТАРТОВЫЙ ЭКРАН ============ */
function drawStartScreen(){
  ctx.fillStyle = 'rgba(10,8,28,0.75)';
  ctx.fillRect(0,0,W,H);

  const base = Math.min(W,H);
  const cx = W/2, cy = H/2;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = `bold ${Math.round(base*0.105)}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
  ctx.fillStyle = '#ffd93d';
  ctx.shadowColor = '#ffd93d';
  ctx.shadowBlur = 34;
  ctx.fillText('GEOMETRY', cx, cy - base*0.085);
  ctx.fillText('DASH', cx, cy + base*0.025);
  ctx.shadowBlur = 0;

  const pulse = 0.65 + 0.35*Math.sin(performance.now()/380);
  ctx.globalAlpha = pulse;
  ctx.font = `bold ${Math.round(base*0.042)}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('Нажми, чтобы начать', cx, cy + base*0.165);
  ctx.globalAlpha = 1;

  ctx.font = `${Math.round(base*0.030)}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('Пробел / клик / тап — прыжок', cx, cy + base*0.225);

  if (best > 0){
    ctx.fillStyle = 'rgba(255,217,61,0.75)';
    ctx.fillText('Лучший результат: ' + best + ' м', cx, cy + base*0.285);
  }
}

/* ============ РЕНДЕР ============ */
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  drawBackground();

  const shx = shake > 0.2 ? (Math.random()-0.5)*shake : 0;
  const shy = shake > 0.2 ? (Math.random()-0.5)*shake : 0;

  ctx.save();
  ctx.scale(scale, scale);
  ctx.translate(-cameraX + shx, shy);

  drawGround();
  drawObstacles();
  drawParticles();
  if (state !== 'dead') drawPlayer();

  ctx.restore();

  drawHUD();

  if (flashAlpha > 0){
    ctx.fillStyle = 'rgba(255,255,255,' + flashAlpha + ')';
    ctx.fillRect(0,0,W,H);
  }

  if (state === 'ready') drawStartScreen();
}

/* ============ ГЛАВНЫЙ ЦИКЛ ============ */
function loop(now){
  requestAnimationFrame(loop);

  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (!isFinite(dt) || dt < 0) dt = 0;
  if (dt > 0.1) dt = 0.1;

  if (state === 'playing'){
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard++ < 12){
      update(STEP);
      acc -= STEP;
      if (state !== 'playing') break;
    }
  } else if (state === 'dead'){
    deathTimer += dt;
    if (deathTimer > 0.85 && !holding){
      attempts++;
      reset();
      state = 'playing';
    }
  }

  updateParticles(dt);

  if (shake > 0)      shake      = Math.max(0, shake - dt*55);
  if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt*2.6);

  render();
}

/* ============ УПРАВЛЕНИЕ ============ */
function press(){
  if (state === 'ready'){
    attempts = 1;
    reset();
    state = 'playing';
    holding = true;
    return;
  }
  holding = true;
}
function release(){
  holding = false;
}

window.addEventListener('keydown', function(e){
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW'){
    e.preventDefault();
    if (!e.repeat) press();
  }
}, { passive:false });

window.addEventListener('keyup', function(e){
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW'){
    e.preventDefault();
    release();
  }
}, { passive:false });

cv.addEventListener('pointerdown', function(e){
  e.preventDefault();
  press();
}, { passive:false });

window.addEventListener('pointerup',     function(){ release(); });
window.addEventListener('pointercancel', function(){ release(); });
window.addEventListener('blur',          function(){ release(); });
window.addEventListener('contextmenu',   function(e){ e.preventDefault(); });

/* ============ СТАРТ ============ */
window.addEventListener('resize', function(){
  resize();
  if (state === 'ready') reset();
});
window.addEventListener('orientationchange', function(){
  setTimeout(function(){ resize(); if (state === 'ready') reset(); }, 120);
});

resize();
reset();
lastTime = performance.now();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
