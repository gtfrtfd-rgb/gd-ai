name: Deploy Static Content to Pages

on:
  push:
    branches: [ "main" ]

# Разрешаем воркфлоу делать публикации на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Исключаем одновременные деплои
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Загружаем корень репозитория, где лежит index.html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4